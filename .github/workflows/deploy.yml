name: Deploy - Frontend para PTisp

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Compilar (build)
        run: |
          rm -rf node_modules/.cache
          npm run build
        env:
          REACT_APP_BACKEND_URL: ${{ secrets.PTISP_BACKEND_URL }}
          CI: false

      - name: Enviar build/ por FTP/FTPS para a PTisp
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.PTISP_FTP_SERVER }}
          username: ${{ secrets.PTISP_FTP_USERNAME }}
          password: ${{ secrets.PTISP_FTP_PASSWORD }}
          protocol: ftps
          # Pasta real do subdomínio (confirmado por listagem FTP direta:
          # é uma pasta própria na raiz da conta, não dentro de public_html,
          # que pertence ao domínio principal da paróquia).
          server-dir: ${{ secrets.PTISP_FRONTEND_SERVER_DIR || './sn.paroquiasaonicolau.pt/' }}
          local-dir: "./build/"
          # Limpa sempre o servidor para o estado exato do build local.
          # Seguro aqui (ao contrário do backend): esta pasta só tem os
          # ficheiros gerados pelo build + .htaccess, versionado em public/.
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
