name: Deploy - Frontend para PTisp

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: DEBUG temporário - comparar ficheiro real via FTP vs HTTP
        run: |
          echo "--- LIST detalhado (tamanhos/datas) de sn.paroquiasaonicolau.pt/ ---"
          curl --ssl-reqd "ftp://$SERVER/sn.paroquiasaonicolau.pt/" --user "$USER:$PASS" -k --max-time 30 || echo "falhou"
          echo "--- conteudo de index.html via FTP direto ---"
          curl --ssl-reqd "ftp://$SERVER/sn.paroquiasaonicolau.pt/index.html" --user "$USER:$PASS" -k --max-time 30 || echo "falhou"
        env:
          SERVER: ${{ secrets.PTISP_FTP_SERVER }}
          USER: ${{ secrets.PTISP_FTP_USERNAME }}
          PASS: ${{ secrets.PTISP_FTP_PASSWORD }}

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Compilar (build)
        run: |
          rm -rf node_modules/.cache
          npm run build
        env:
          REACT_APP_BACKEND_URL: ${{ secrets.PTISP_BACKEND_URL }}
          CI: false

      - name: Enviar build/ por FTP/FTPS para a PTisp
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.PTISP_FTP_SERVER }}
          username: ${{ secrets.PTISP_FTP_USERNAME }}
          password: ${{ secrets.PTISP_FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ secrets.PTISP_FRONTEND_SERVER_DIR || './public_html/' }}
          local-dir: "./build/"
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
