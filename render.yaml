services:
  - type: web
    name: frontendsnretratos
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: build
    pullRequestPreviewsEnabled: false
    # Defina REACT_APP_BACKEND_URL no ambiente do Render ou no painel da aplicação.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /service-worker.js
        name: Cache-Control
        value: no-cache
